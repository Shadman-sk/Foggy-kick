<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slap Foggy</title>
<style>
  :root {
    --bg-top: #2b4a3a;
    --bg-bottom: #10201a;
    --ink: #fff6e0;
    --accent: #ffcc33;
    --hit: #ff3b3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--bg-top), var(--bg-bottom) 75%);
    color: var(--ink);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  header {
    position: fixed; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; z-index: 20; gap: 12px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: clamp(20px, 4vw, 34px); letter-spacing: 1px; text-shadow: 3px 3px 0 #000; }
  h1 span { color: var(--accent); }
  .stats { display: flex; gap: 10px; align-items: center; }
  .pill {
    background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 6px 14px; font-weight: bold; font-size: 15px;
  }
  .pill b { color: var(--accent); font-size: 18px; }
  button {
    background: rgba(0,0,0,.45); color: var(--ink); border: 2px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: bold; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }

  #meter {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(360px, calc(100% - 32px)); z-index: 20; text-align: center; font-size: 13px; opacity: .85;
  }
  #meter .bar { height: 12px; border-radius: 6px; background: rgba(0,0,0,.5); overflow: hidden; margin-top: 4px; }
  #meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd23f, #ff7a1a, #ff2d2d); transition: width .15s; }

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: none;
  }
  #shaker { position: relative; width: min(94vw, calc((100vh - 150px) * 1.4)); margin-top: 30px; }
  #elf {
    position: relative; width: 100%;
    transform-origin: 62% 92%;
    will-change: transform;
  }
  #elf img { width: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  #blush {
    position: absolute; pointer-events: none; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,40,40,.75), rgba(255,40,40,0) 70%);
    mix-blend-mode: multiply; opacity: 0; transition: opacity .4s;
  }
  #marks { position: absolute; inset: 0; pointer-events: none; }
  .print {
    position: absolute; width: 11%; aspect-ratio: 1; margin: -5.5% 0 0 -5.5%;
    mix-blend-mode: multiply; animation: fadePrint 7s ease-in forwards;
  }
  @keyframes fadePrint { 0% { opacity: .85; } 60% { opacity: .55; } 100% { opacity: 0; } }

  #hand {
    position: fixed; z-index: 30; pointer-events: none; font-size: 84px; line-height: 1;
    transform: translate(-50%, -50%) rotate(-20deg); filter: drop-shadow(4px 6px 4px rgba(0,0,0,.5));
    transition: transform .08s;
  }
  #hand.swing { transform: translate(-50%, -50%) rotate(40deg) scale(1.25); transition: transform .05s; }
  #hand.hidden { display: none; }

  .fx { position: fixed; pointer-events: none; z-index: 25; }
  .word {
    font: 900 clamp(34px, 7vw, 72px) Impact, "Arial Black", sans-serif;
    color: var(--accent); -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 5px 5px 0 #c4161c;
    transform: translate(-50%, -50%) scale(.2) rotate(var(--r));
    animation: pop .8s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(var(--r)); opacity: 1; }
    30% { transform: translate(-50%, -60%) scale(1.1) rotate(var(--r)); }
    100% { transform: translate(-50%, -110%) scale(1) rotate(var(--r)); opacity: 0; }
  }
  .burst {
    width: 160px; height: 160px; margin: -80px 0 0 -80px;
    animation: burst .35s ease-out forwards;
  }
  @keyframes burst { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .particle { font-size: 26px; transform: translate(-50%, -50%); }
  .bubble {
    background: #fff; color: #222; font-weight: bold; padding: 8px 14px; border-radius: 16px;
    border: 3px solid #000; font-size: clamp(14px, 2.2vw, 20px); white-space: nowrap;
    transform: translate(-50%, -100%); animation: bubble 1.6s ease forwards;
  }
  @keyframes bubble {
    0% { opacity: 0; transform: translate(-50%, -80%) scale(.6); }
    12% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -120%); }
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 24; }
  #dizzy { position: absolute; pointer-events: none; font-size: clamp(18px, 3vw, 32px); }
  #dizzy span { position: absolute; left: 0; top: 0; }
  #banner {
    position: fixed; top: 22%; left: 50%; transform: translateX(-50%); z-index: 26; pointer-events: none;
    font: 900 clamp(28px, 6vw, 60px) Impact, "Arial Black", sans-serif; color: #fff;
    -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 0 20px var(--hit);
    opacity: 0; transition: opacity .3s; text-align: center; white-space: nowrap;
  }
  #banner.show { opacity: 1; }

  /* Overlay drawn in image coordinates: tears, crying mouth, guarding hand */
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .c1, .c2, .c2only, .c3 { opacity: 0; transition: opacity .6s; }
  #elf[data-cry="1"] .c1,
  #elf[data-cry="2"] :is(.c1, .c2, .c2only),
  #elf[data-cry="3"] :is(.c1, .c2, .c3) { opacity: 1; }
  .c2only path { animation: tremble .18s steps(2) infinite; }
  @keyframes tremble { 50% { transform: translateY(1.5px); } }
  .c3 .wail { animation: wail .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes wail { to { transform: scaleY(1.25); } }
  #puddle { transition: rx .6s, ry .6s; }
  #guard { transform: translateY(300px); opacity: 0; transition: transform .1s ease-out, opacity .1s; }
  #guard.up { transform: none; opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>SLAP <span>FOGGY</span></h1>
    <div class="stats">
      <div class="pill">Slaps <b id="count">0</b></div>
      <div class="pill">Combo <b id="combo">x0</b></div>
      <div class="pill">Best <b id="best">0</b></div>
      <div class="pill">Mood <b id="mood">😠</b></div>
      <button id="mute" title="Toggle sound">🔊</button>
      <button id="reset" title="Reset">↺</button>
    </div>
  </header>

  <div id="stage">
    <div id="shaker">
      <div id="elf">
        <img src="foggy.png" alt="Foggy the elf" draggable="false">
        <div id="blush"></div>
        <div id="marks"></div>
        <div id="dizzy"></div>
        <svg id="overlay" viewBox="0 0 984 703" aria-hidden="true">
          <defs>
            <radialGradient id="skin" cx="50%" cy="40%" r="65%">
              <stop offset="0" stop-color="#f3b98c"/><stop offset="1" stop-color="#e09c74"/>
            </radialGradient>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d4f0ff" stop-opacity=".95"/><stop offset="1" stop-color="#4fa8ff" stop-opacity=".9"/>
            </linearGradient>
            <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
          </defs>

          <ellipse id="puddle" cx="660" cy="690" rx="0" ry="0" fill="#5fb0ff" fill-opacity=".5" stroke="#bfe4ff" stroke-opacity=".7" stroke-width="3"/>

          <!-- sad eyebrows replace the angry ones -->
          <g class="c2 c3brows">
            <ellipse cx="562" cy="233" rx="36" ry="9" fill="url(#skin)" filter="url(#soft)"/>
            <ellipse cx="655" cy="233" rx="36" ry="9" fill="url(#skin)" filter="url(#soft)"/>
            <ellipse cx="594" cy="244" rx="11" ry="7" fill="url(#skin)" filter="url(#soft)"/>
            <ellipse cx="624" cy="244" rx="11" ry="7" fill="url(#skin)" filter="url(#soft)"/>
            <path d="M534 238 Q556 224 588 222 M630 222 Q660 224 682 238" fill="none" stroke="#5b3417" stroke-width="9" stroke-linecap="round"/>
          </g>

          <!-- teary eyes -->
          <g class="c1" fill="url(#water)" stroke="#2b6ea8" stroke-width="1.5">
            <path d="M545 262 Q565 276 586 262 Q566 284 545 262Z"/>
            <path d="M626 262 Q647 276 670 262 Q648 284 626 262Z"/>
            <circle cx="556" cy="266" r="2" fill="#fff" stroke="none"/>
            <circle cx="638" cy="266" r="2" fill="#fff" stroke="none"/>
          </g>

          <!-- tear streaks -->
          <g class="c2" fill="none" stroke="#8fcfff" stroke-opacity=".65" stroke-width="7" stroke-linecap="round">
            <path d="M556 272 Q550 300 558 338"/>
            <path d="M660 272 Q668 300 660 338"/>
          </g>

          <!-- trembling frown -->
          <g class="c2only">
            <ellipse cx="609" cy="316" rx="36" ry="11" fill="url(#skin)" filter="url(#soft)"/>
            <path d="M580 320 q7 -9 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#3a1f14" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- wailing open mouth -->
          <g class="c3">
            <ellipse cx="609" cy="317" rx="40" ry="16" fill="url(#skin)" filter="url(#soft)"/>
            <g class="wail">
              <path d="M585 310 Q609 298 633 310 Q636 334 609 336 Q582 334 585 310Z" fill="#5a1414" stroke="#2a120c" stroke-width="4"/>
              <path d="M590 309 Q609 302 628 309 L626 313 Q609 308 592 313Z" fill="#fff"/>
              <ellipse cx="609" cy="328" rx="13" ry="5" fill="#e0606a"/>
            </g>
          </g>

          <g id="tears"></g>

          <!-- guarding hand -->
          <g id="guard" stroke="#22180f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M596 352 L664 358 L756 432 Q744 474 700 470Z" fill="#6f8a3c"/>
            <path d="M640 400 Q680 420 720 450" fill="none" stroke-width="2.5" stroke-opacity=".5"/>
            <path d="M592 356 Q630 342 666 360 L662 382 Q630 368 588 378Z" fill="#5c7330"/>
            <path d="M604 360 L606 318 L652 318 L654 360Z" fill="url(#skin)"/>
            <rect x="580" y="264" width="18" height="50" rx="9" fill="url(#skin)" transform="rotate(-28 598 312)"/>
            <path d="M590 256 Q586 334 628 336 Q670 334 666 256Z" fill="url(#skin)"/>
            <rect x="591" y="206" width="18" height="62" rx="9" fill="url(#skin)"/>
            <rect x="609" y="192" width="18" height="76" rx="9" fill="url(#skin)"/>
            <rect x="627" y="196" width="18" height="72" rx="9" fill="url(#skin)"/>
            <rect x="645" y="212" width="17" height="56" rx="8.5" fill="url(#skin)"/>
            <rect x="594" y="252" width="66" height="18" fill="url(#skin)" stroke="none"/>
            <path d="M604 296 Q626 306 648 292 M610 316 Q628 322 644 312" fill="none" stroke-width="2.5" stroke-opacity=".5"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div id="meter">Swipe faster for a harder slap!<div class="bar"><div class="fill" id="power"></div></div></div>
  <div id="hand" class="hidden">🖐️</div>
  <div id="flash"></div>
  <div id="banner"></div>

<script>
(() => {
  // Regions in source-image pixels (foggy.png is 984 x 703).
  const IMG_W = 984, IMG_H = 703;
  const FACE = { x: 610, y: 272, rx: 90, ry: 74 };
  const EYES = [{ x: 563, y: 270, side: -1 }, { x: 650, y: 270, side: 1 }];
  const BODY = { x: 620, y: 420, rx: 210, ry: 290 };
  const SQUIRREL = { x: 170, y: 320, rx: 80, ry: 80 };

  const $ = id => document.getElementById(id);
  const stage = $('stage'), shaker = $('shaker'), elf = $('elf'), marks = $('marks');
  const hand = $('hand'), flash = $('flash'), blush = $('blush'), dizzy = $('dizzy'), banner = $('banner');

  let count = 0, combo = 0, lastHit = 0, heat = 0, muted = false;
  let best = 0;
  try { best = +localStorage.getItem('foggy-best') || 0; } catch {}
  $('best').textContent = best;

  // --- Elf wobble physics (damped spring) ---
  let angle = 0, angVel = 0, offset = 0, offVel = 0, squash = 0, sqVel = 0;
  let shake = 0;
  function tick() {
    angVel += -0.09 * angle - 0.12 * angVel; angle += angVel;
    offVel += -0.08 * offset - 0.14 * offVel; offset += offVel;
    sqVel += -0.2 * squash - 0.18 * sqVel; squash += sqVel;
    elf.style.transform =
      `translateX(${offset}px) rotate(${angle}deg) scale(${1 + squash}, ${1 - squash})`;

    shake *= 0.86;
    shaker.style.transform = shake > 0.3
      ? `translate(${(Math.random() - .5) * shake}px, ${(Math.random() - .5) * shake}px)` : '';

    heat = Math.max(0, heat - 0.0025);
    blush.style.opacity = Math.min(heat, 0.9);

    if (combo && performance.now() - lastHit > 1200) { combo = 0; $('combo').textContent = 'x0'; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function layoutOverlays() {
    const s = elf.clientWidth / IMG_W;
    Object.assign(blush.style, {
      left: (FACE.x - FACE.rx * 1.1) * s + 'px', top: (FACE.y - FACE.ry * 0.6) * s + 'px',
      width: FACE.rx * 2.2 * s + 'px', height: FACE.ry * 1.6 * s + 'px'
    });
    Object.assign(dizzy.style, { left: FACE.x * s + 'px', top: (FACE.y - FACE.ry * 1.6) * s + 'px' });
  }
  window.addEventListener('resize', layoutOverlays);
  elf.querySelector('img').addEventListener('load', layoutOverlays);
  layoutOverlays();

  // --- Sound (synthesized, no files needed) ---
  let ctx;
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noiseBurst(dur, freq, q, gain) {
    const a = audio(), n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); g.gain.value = gain;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }
  function tone(type, from, to, dur, gain) {
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  }
  function slapSound(power) {
    if (muted) return;
    noiseBurst(0.12, 2200, 0.8, 0.9 * Math.min(power, 1.6));
    noiseBurst(0.05, 5000, 1.2, 0.5);
    tone('sine', 160, 50, 0.18, 0.6 * Math.min(power, 1.5));
    if (Math.random() < 0.25) setTimeout(() => tone('triangle', 900, 250, 0.35, 0.15), 60);
  }
  function whoosh() { if (!muted) noiseBurst(0.2, 900, 0.5, 0.25); }

  // --- Pointer tracking for swipe power ---
  let px = 0, py = 0, pt = 0, speed = 0;
  function onMove(e) {
    const now = performance.now(), dt = Math.max(now - pt, 1);
    const v = Math.hypot(e.clientX - px, e.clientY - py) / dt;
    speed = speed * 0.6 + v * 0.4;
    px = e.clientX; py = e.clientY; pt = now;
    hand.style.left = px + 'px'; hand.style.top = py + 'px';
    hand.classList.remove('hidden');
    $('power').style.width = Math.min(100, speed * 40) + '%';
  }
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerleave', () => hand.classList.add('hidden'));
  setInterval(() => { speed *= 0.7; $('power').style.width = Math.min(100, speed * 40) + '%'; }, 80);

  function inEllipse(x, y, r) { return ((x - r.x) / r.rx) ** 2 + ((y - r.y) / r.ry) ** 2 <= 1; }

  stage.addEventListener('pointerdown', e => {
    onMove(e);
    audio();
    hand.classList.add('swing');
    setTimeout(() => hand.classList.remove('swing'), 120);

    const rect = shaker.getBoundingClientRect();
    const s = rect.width / IMG_W;
    const ix = (e.clientX - rect.left) / s, iy = (e.clientY - rect.top) / s;

    if (inEllipse(ix, iy, SQUIRREL)) {
      whoosh();
      say(e.clientX, e.clientY - 30, pick(['Leave me out of this!', 'Not me!!', 'Eek!', 'I saw nothing.']));
      return;
    }
    const face = inEllipse(ix, iy, FACE);
    if (!face && !inEllipse(ix, iy, BODY)) { whoosh(); popWord(e.clientX, e.clientY, 'MISS', '#9ad'); return; }

    const power = Math.min(0.8 + speed * 0.6, 3) * (face ? 1.5 : 1);
    slapAt(e.clientX, e.clientY, ix, iy, s, power, face);
  });

  // Face slaps go through the guard check; body slaps always land.
  function slapAt(cx, cy, ix, iy, s, power, face) {
    if (face && guardUp) {
      if (power >= 3.6) { guardBreak(cx, cy); hit(cx, cy, ix, iy, s, power, true); }
      else blocked(cx, cy);
      return;
    }
    hit(cx, cy, ix, iy, s, power, face);
  }

  function hit(cx, cy, ix, iy, s, power, face) {
    const now = performance.now();
    combo = now - lastHit < 1200 ? combo + 1 : 1;
    lastHit = now;
    count++;
    $('count').textContent = count;
    $('combo').textContent = 'x' + combo;
    if (count > best) { best = count; $('best').textContent = best; try { localStorage.setItem('foggy-best', best); } catch {} }

    // Knock him away from the side that was hit.
    const dir = ix < FACE.x ? 1 : -1;
    angVel += dir * (4 + power * 3);
    offVel += dir * (6 + power * 6);
    sqVel += 0.03 * power;
    shake = Math.min(10 + power * 8 + combo, 40);
    if (face) heat = Math.min(heat + 0.12 * power, 1);

    slapSound(power);
    flashScreen(Math.min(0.15 + power * 0.08, 0.45));
    burst(cx, cy, power);
    handprint(ix * s, iy * s, dir);
    particles(cx, cy, dir, Math.round(5 + power * 4));

    const words = power > 2.4 ? ['K.O.!!', 'MEGA SLAP!', 'OBLITERATED!']
               : face ? ['SLAP!', 'WHAP!', 'SMACK!', 'THWACK!', 'POW!']
               : ['BONK!', 'WHACK!', 'BOP!'];
    popWord(cx, cy - 20, pick(words));

    addSad((face ? 1.5 : 0.7) * (power > 2.4 ? 1.5 : 1));

    if (Math.random() < 0.45) {
      const r = shaker.getBoundingClientRect();
      const lines = cryStage >= 2
        ? ['*sob*', 'W-why?!', 'I want my mom 😭', 'S-stop it... *sniff*', 'WAAAH!', 'I didn\'t do anything!']
        : ['OW!', 'Hey!!', 'Stop it!', 'Not the face!', 'Why?!', 'My goggles!', 'Ouch!', 'I\'m telling mom!', 'That\'s it, I\'m fixing a robot to slap YOU'];
      say(r.left + FACE.x * s - dir * FACE.rx * s * 1.4, r.top + (FACE.y - FACE.ry) * s, pick(lines));
    }

    // He learns: after a face slap he may throw his hand up to block the next one.
    if (face && cryStage < 3 && Math.random() < Math.min(0.15 + count * 0.006, 0.5)) {
      setTimeout(() => raiseGuard(600 + Math.random() * 500), 160);
    }

    setDizzy(combo >= 5);
    milestone(count);
  }

  // --- Guarding hand ---
  const guard = $('guard');
  let guardUp = false, guardTimer, guardReadyAt = 0;
  function raiseGuard(ms) {
    if (guardUp || performance.now() < guardReadyAt) return;
    guardUp = true;
    guard.classList.add('up');
    if (Math.random() < 0.3) sayAtFace(pick(['Nope!', 'Not this time!', 'Ha!', 'Try me!']));
    clearTimeout(guardTimer);
    guardTimer = setTimeout(lowerGuard, ms);
  }
  function lowerGuard() {
    guardUp = false;
    guard.classList.remove('up');
    guardReadyAt = performance.now() + 450;
  }
  setInterval(() => {
    const p = cryStage === 3 ? 0.02 : Math.min(0.03 + count * 0.003, 0.2);
    if (Math.random() < p) raiseGuard(500 + Math.random() * 800);
  }, 350);

  function blocked(cx, cy) {
    combo = 0; $('combo').textContent = 'x0';
    if (!muted) { tone('square', 220, 90, 0.12, 0.12); noiseBurst(0.06, 800, 1, 0.4); }
    popWord(cx, cy - 20, 'BLOCKED!', '#7cf');
    shake = 6;
    guard.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-8px,6px)' }, { transform: 'translate(6px,-3px)' }, { transform: 'translate(0,0)' }], { duration: 200 });
    if (Math.random() < 0.5) sayAtFace(pick(['Ha! Missed me!', 'Too slow!', 'Blocked! 😏', 'Nice try!']));
    clearTimeout(guardTimer);
    guardTimer = setTimeout(lowerGuard, 350 + Math.random() * 400);
  }
  function guardBreak(cx, cy) {
    clearTimeout(guardTimer);
    lowerGuard();
    popWord(cx, cy - 70, 'GUARD BREAK!', '#ff8');
  }
  function sayAtFace(text) {
    const r = shaker.getBoundingClientRect(), s = r.width / IMG_W;
    say(r.left + (FACE.x + FACE.rx * 1.3) * s, r.top + (FACE.y - FACE.ry) * s, text);
  }

  // --- Crying ---
  const tears = $('tears'), puddle = $('puddle');
  const MOODS = ['😠', '🥺', '😢', '😭'];
  const CRY_LINES = [null, '*sniff*...', 'W-why are you doing this?! 😢', 'WAAAAAAAAH!!! 😭'];
  let sad = 0, cryStage = 0, puddleSize = 0, lastSob = 0;
  function addSad(n) { sad = Math.min(sad + n, 40); updateCry(); }
  function updateCry() {
    const next = sad >= 26 ? 3 : sad >= 14 ? 2 : sad >= 6 ? 1 : 0;
    if (next === cryStage) return;
    if (next > cryStage && CRY_LINES[next]) setTimeout(() => sayAtFace(CRY_LINES[next]), 300);
    if (next === 3) { clearTimeout(guardTimer); lowerGuard(); }
    cryStage = next;
    elf.dataset.cry = next;
    $('mood').textContent = MOODS[next];
  }
  const DROP = 'M0 -9 C4 -2 6 2 6 5 A6 6 0 0 1 -6 5 C-6 2 -4 -2 0 -9Z';
  function tearDrop(eye, fountain) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', DROP);
    p.setAttribute('fill', 'url(#water)');
    p.setAttribute('stroke', '#2b6ea8');
    p.setAttribute('stroke-width', '1.2');
    tears.appendChild(p);
    const x0 = eye.x + eye.side * (4 + Math.random() * 6), y0 = eye.y;
    let frames;
    if (fountain) {
      // Cartoon fountain: tears shoot sideways in an arc.
      const vx = eye.side * (90 + Math.random() * 140), vy = -(40 + Math.random() * 60);
      frames = [];
      for (let t = 0; t <= 1.0001; t += 0.1) {
        frames.push({ transform: `translate(${x0 + vx * t}px, ${y0 + vy * t + 260 * t * t}px) scale(${1 + t * 0.6})`, opacity: 1 - t * t * 0.6 });
      }
    } else {
      const sway = eye.side * (4 + Math.random() * 6);
      frames = [
        { transform: `translate(${x0}px, ${y0}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${x0}px, ${y0 + 6}px) scale(1)`, opacity: 1, offset: 0.15 },
        { transform: `translate(${x0 + sway}px, ${y0 + 40}px) scale(1)`, opacity: 1, offset: 0.6 },
        { transform: `translate(${x0 + sway * 0.6}px, ${y0 + 72}px) scale(.8)`, opacity: 0 }
      ];
    }
    p.animate(frames, { duration: fountain ? 750 : 1300 + Math.random() * 400, easing: 'linear' }).onfinish = () => p.remove();
  }
  function sniffle() {
    if (muted) return;
    noiseBurst(0.07, 3200, 2, 0.18);
    setTimeout(() => noiseBurst(0.09, 2800, 2, 0.15), 120);
  }
  function wail() {
    if (muted) return;
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(), lfo = a.createOscillator(), lfoGain = a.createGain();
    const f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(560, t); o.frequency.linearRampToValueAtTime(620, t + 0.25); o.frequency.exponentialRampToValueAtTime(360, t + 1.1);
    lfo.frequency.value = 7; lfoGain.gain.value = 18;
    lfo.connect(lfoGain).connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 1400;
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.1); g.gain.exponentialRampToValueAtTime(0.001, t + 1.15);
    o.connect(f).connect(g).connect(a.destination);
    o.start(t); lfo.start(t); o.stop(t + 1.2); lfo.stop(t + 1.2);
  }
  setInterval(() => {
    const now = performance.now();
    if (now - lastHit > 2000) { sad = Math.max(0, sad - 0.04); updateCry(); }
    if (cryStage === 1 && Math.random() < 0.03) tearDrop(pick(EYES), false);
    if (cryStage === 2 && Math.random() < 0.35) tearDrop(pick(EYES), false);
    if (cryStage === 3) {
      EYES.forEach(e => tearDrop(e, true));
      puddleSize = Math.min(puddleSize + 0.6, 170);
      if (now - lastSob > 650) { lastSob = now; sqVel += 0.012; angVel += (Math.random() - 0.5) * 0.8; }
    } else {
      puddleSize = Math.max(0, puddleSize - 0.15);
    }
    puddle.setAttribute('rx', puddleSize);
    puddle.setAttribute('ry', puddleSize * 0.09);
    if (cryStage >= 2 && Math.random() < 0.012) sniffle();
    if (cryStage === 3 && now - lastHit > 600 && Math.random() < 0.03) wail();
  }, 90);

  // --- Effects ---
  function fx(cls, x, y, html) {
    const el = document.createElement('div');
    el.className = 'fx ' + cls;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    if (html) el.innerHTML = html;
    document.body.appendChild(el);
    return el;
  }
  function popWord(x, y, text, color) {
    const el = fx('word', x, y);
    el.textContent = text;
    el.style.setProperty('--r', (Math.random() * 30 - 15) + 'deg');
    if (color) el.style.color = color;
    setTimeout(() => el.remove(), 850);
  }
  function burst(x, y, power) {
    const pts = [];
    for (let i = 0; i < 24; i++) {
      const r = i % 2 ? 30 : 80, a = (i / 24) * Math.PI * 2;
      pts.push(`${80 + Math.cos(a) * r},${80 + Math.sin(a) * r}`);
    }
    const el = fx('burst', x, y,
      `<svg viewBox="0 0 160 160" width="100%" height="100%"><polygon points="${pts.join(' ')}" fill="#fff36b" stroke="#ff5a00" stroke-width="5"/></svg>`);
    el.style.width = el.style.height = 120 + power * 50 + 'px';
    el.style.margin = `-${60 + power * 25}px 0 0 -${60 + power * 25}px`;
    setTimeout(() => el.remove(), 400);
  }
  function particles(x, y, dir, n) {
    const icons = ['⭐', '✨', '💥', '💫', '🌟'];
    for (let i = 0; i < n; i++) {
      const el = fx('particle', x, y);
      el.textContent = pick(icons);
      const a = (dir > 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 2.2;
      const d = 80 + Math.random() * 160;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(.5)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 40}px)) scale(1.2) rotate(${Math.random() * 360}deg)`, opacity: 0 }
      ], { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(.1,.8,.3,1)' }).onfinish = () => el.remove();
    }
  }
  const PRINT_SVG = `<svg viewBox="0 0 100 100" width="100%" height="100%"><g fill="rgba(225,20,30,.75)">
    <ellipse cx="50" cy="64" rx="24" ry="26"/>
    <rect x="25" y="14" width="11" height="40" rx="5.5" transform="rotate(-12 30 50)"/>
    <rect x="38" y="6" width="11" height="44" rx="5.5" transform="rotate(-4 43 50)"/>
    <rect x="51" y="8" width="11" height="42" rx="5.5" transform="rotate(4 56 50)"/>
    <rect x="63" y="16" width="10" height="36" rx="5" transform="rotate(12 68 50)"/>
    <rect x="70" y="50" width="11" height="30" rx="5.5" transform="rotate(50 72 62)"/></g></svg>`;
  function handprint(x, y, dir) {
    const el = document.createElement('div');
    el.className = 'print';
    el.innerHTML = PRINT_SVG;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.transform = `rotate(${dir * (15 + Math.random() * 30)}deg) scaleX(${dir})`;
    marks.appendChild(el);
    if (marks.children.length > 25) marks.firstChild.remove();
    setTimeout(() => el.remove(), 7000);
  }
  function flashScreen(o) {
    flash.animate([{ opacity: o }, { opacity: 0 }], { duration: 160, easing: 'ease-out' });
  }
  function say(x, y, text) {
    const el = fx('bubble', x, y);
    el.textContent = text;
    setTimeout(() => el.remove(), 1650);
  }
  let dizzyAnim;
  function setDizzy(on) {
    if (on && !dizzyAnim) {
      dizzy.innerHTML = '<span>💫</span><span>⭐</span><span>💫</span><span>⭐</span>';
      const spans = [...dizzy.children];
      let t = 0;
      dizzyAnim = setInterval(() => {
        t += 0.12;
        const r = elf.clientWidth * 0.09;
        spans.forEach((sp, i) => {
          const a = t + (i / spans.length) * Math.PI * 2;
          sp.style.transform = `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r * 0.3}px))`;
        });
        if (performance.now() - lastHit > 2500) { clearInterval(dizzyAnim); dizzyAnim = null; dizzy.innerHTML = ''; }
      }, 30);
    }
  }
  const MILESTONES = { 10: 'Warming up! 🔥', 25: 'Foggy is FURIOUS 😤', 50: 'SLAP MASTER 🖐️', 100: 'LEGENDARY SLAPPER 👑', 250: 'Please... he has a family 😭' };
  let bannerTimer;
  function milestone(n) {
    if (!MILESTONES[n]) return;
    banner.textContent = MILESTONES[n];
    banner.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove('show'), 1800);
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  $('mute').addEventListener('click', e => { muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊'; });
  $('reset').addEventListener('click', () => {
    count = combo = 0; heat = 0; marks.innerHTML = '';
    sad = 0; puddleSize = 0; updateCry(); lowerGuard();
    $('count').textContent = '0'; $('combo').textContent = 'x0';
  });
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    const r = shaker.getBoundingClientRect(), s = r.width / IMG_W;
    const side = Math.random() < 0.5 ? -1 : 1;
    const ix = FACE.x + side * FACE.rx * 0.55, iy = FACE.y + 15;
    audio();
    slapAt(r.left + ix * s, r.top + iy * s, ix, iy, s, 1.4, true);
  });
})();
</script>
</body>
